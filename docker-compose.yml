services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: isp-reseller-backend:latest
    container_name: isp-reseller-backend
    restart: unless-stopped
    ports:
      - "12001:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/isp_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-isp_billing_only_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-0xd_Eye]47JF}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_URLS:-http://localhost:3203}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      BILLING_CYCLE_CRON: "0 0 1 * * ?"
    networks:
      - sas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: isp-reseller-frontend:latest
    container_name: isp-reseller-frontend
    restart: unless-stopped
    ports:
      - "3203:80"
    depends_on:
      - backend
    networks:
      - sas-net

networks:
  sas-net:
    external: true
