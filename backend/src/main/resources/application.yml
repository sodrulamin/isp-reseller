server:
  port: 8080

spring:
  application:
    name: isp-reseller-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:5624/isp_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:isp_billing_only_user}
    password: ${SPRING_DATASOURCE_PASSWORD:0xd_Eye]47JF}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 hours
  refreshExpirationMs: 604800000 # 7 days

billing:
  cycle:
    cron: "${BILLING_CYCLE_CRON:0 0 1 * * ?}" # Runs every night at 1:00 AM
    zone: "${BILLING_CYCLE_ZONE:Asia/Dhaka}"

logging:
  level:
    com.isp.billing: INFO
    org.springframework.security: WARN
